name: Validate Newsroom build and scheduled publishing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_runtime:
        description: Package the tested Ruby 3.3 Linux dependencies for the VPS
        type: boolean
        default: false

concurrency:
  group: deploy-newsroom
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Test publication boundaries
        run: bundle exec ruby tests/scheduled_publishing.rb

      - name: Build and validate
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec ruby scripts/scheduled_build.rb "$PWD" "$PWD/_site"
          bundle exec ruby tests/editorial_integration.rb
          bundle exec ruby tests/media_kit.rb

      # The dedicated VPS timer builds main every minute, runs these content
      # checks, then deploys. GitHub's best-effort cron is not a publication clock.
      - name: Package tested server dependencies
        if: inputs.package_runtime == true
        run: tar -czf "$RUNNER_TEMP/newsroom-ruby33-linux.tar.gz" -C vendor/bundle ruby

      - uses: actions/upload-artifact@v4
        if: inputs.package_runtime == true
        with:
          name: newsroom-ruby33-linux
          path: ${{ runner.temp }}/newsroom-ruby33-linux.tar.gz
          retention-days: 7
