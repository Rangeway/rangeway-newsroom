formats:
  - name: Waystation
    line: Streamlined comfort
    description: An automated, unstaffed stop pairing ultra-fast charging with a climate-controlled driver's lounge, premium restrooms, seating, Wi-Fi, and automated retail.
  - name: Basecamp
    line: The full-service destination
    description: A staffed, full-service destination with a larger driver's lounge, a hospitality-trained on-site team, and food-and-beverage or retail space for a local operator.
  - name: Summit
    line: Where the road meets rest
    description: A hospitality destination designed for overnight stays, with Lookouts, a central clubhouse, and off-grid charging.
chargevia: ChargeVia is Rangeway's gas station-style fast-charging concept, designed to stand on its own or adapt to existing retail and roadside destinations through a flexible site-partner format.
founder_bio: >-
  Zak Winnick is the founder and CEO of Rangeway. He brings 15+ years in luxury hospitality operations and firsthand experience as an EV driver to the company. His work starts with a simple conviction: charging should feel like hospitality.
