usage: >-
  Use the supplied logo artwork without stretching, recoloring, or rearranging it. The stylized R is the first letter of the wordmark; do not add a second R or a separate mark beside it. Use cream artwork on dark backgrounds and charcoal artwork on light backgrounds.
