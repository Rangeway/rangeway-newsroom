# Rangeway Energy Newsroom
# Jekyll configuration for GitHub Pages

# Site settings
title: Rangeway Newsroom
description: "Stories, announcements, and media resources from Rangeway, a hospitality-first EV charging network in development."
url: "https://newsroom.rangeway.co"
baseurl: ""
asset_version: "2026-10-01-media-kit"

# Organization info
organization:
  name: Rangeway
  tagline: "Travel farther. Stop better."
  main_site: "https://rangeway.co"
  email: media@rangeway.co
  phone: "(650) 420-6300"

# Social media
social:
  twitter: "https://x.com/rangewayev"
  instagram: "https://instagram.com/rangewayev"
  linkedin: "https://linkedin.com/company/rangewayenergy"
  youtube: "https://youtube.com/@rangewayev"

# Analytics
analytics:
  enabled: true
  tinylytics_id: "Ttvq2PXhcrG1Fe7a9H-v"

# Build settings
timezone: America/Los_Angeles
markdown: kramdown
theme: null
future: false  # Hide posts with future dates until their publish date
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  press_releases:
    output: true
    permalink: /press/:title/
  case_studies:
    output: true
    permalink: /case-studies/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      category: "blog"
  - scope:
      path: ""
      type: "press_releases"
    values:
      layout: "press-release"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case-study"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOY.md
  - .gitignore
  - vendor
  - docs
  - tests
  - scripts
  - ops
  - .superpowers
  - CLAUDE.md
  - CONTENT-GUIDE.md
