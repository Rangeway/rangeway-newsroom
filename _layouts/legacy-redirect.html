<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/editorial.css' | relative_url }}?v={{ site.asset_version }}">
</head>
<body>
  <main class="wrap" style="padding:clamp(48px,12vw,160px) 0">
    <h1>This page has moved.</h1>
    <p style="margin-top:24px">Continue to <a class="text-link" href="{{ page.redirect_to | relative_url }}">{{ page.title | escape }} ↗</a></p>
  </main>
</body>
</html>
